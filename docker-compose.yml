name: lakewire

x-env: &env
  KAFKA_BOOTSTRAP: kafka:9092
  S3_ENDPOINT: http://s3:9000
  S3_HOSTPORT: s3:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakewire}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
  LAKE_BUCKET: ${LAKE_BUCKET:-lake}
  USER_AGENT: ${USER_AGENT:-Lakewire/1.0 (set USER_AGENT in .env)}
  WIKIS: ${WIKIS:-enwiki,dewiki,frwiki,eswiki,jawiki}
  PAGEVIEW_DOMAINS: ${PAGEVIEW_DOMAINS:-en,en.m}
  PAGEVIEW_TOP_N: ${PAGEVIEW_TOP_N:-50000}
  PAGEVIEWS_START_DATE: ${PAGEVIEWS_START_DATE:-2026-11-10}
  BRONZE_RETENTION_DAYS: ${BRONZE_RETENTION_DAYS:-14}
  SILVER_RETENTION_DAYS: ${SILVER_RETENTION_DAYS:-120}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}

services:
  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka: {condition: service_healthy}
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic wiki.edits.raw --partitions 3 --replication-factor 1 --config retention.ms=172800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic wiki.edits.dlq --partitions 1 --replication-factor 1 --config retention.ms=604800000

  # S3-compatible object store (SeaweedFS, Apache-2.0). MinIO's community images were withdrawn in 2025.
  # Master, volume server, filer and S3 gateway run in one process; the S3 API listens on :9000.
  s3:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    mem_limit: 2g  # measured ~0.7 GB after a day of data; headroom because it was still creeping up
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=9000", "-master.volumeSizeLimitMB=1024", "-volume.max=100"]
    environment:
      # The S3 gateway creates its admin identity from these standard variables.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lakewire}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  s3-init:
    image: amazon/aws-cli:2.40.1
    depends_on:
      s3: {condition: service_healthy}
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$LAKE_BUCKET" 2>/dev/null || aws --endpoint-url http://s3:9000 s3 mb "s3://$$LAKE_BUCKET"; do sleep 2; done
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lakewire}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: us-east-1
      LAKE_BUCKET: ${LAKE_BUCKET:-lake}

  producer:
    build: {context: ., dockerfile: docker/producer.Dockerfile}
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment: *env
    ports: ["127.0.0.1:8000:8000"]

  spark-stream:
    build: {context: ., dockerfile: docker/spark.Dockerfile}
    restart: unless-stopped
    mem_limit: 4g
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      s3-init: {condition: service_completed_successfully}
    environment:
      <<: *env
      SPARK_DRIVER_MEMORY: 2g
    ports: ["127.0.0.1:8001:8001"]

  airflow:
    build: {context: ., dockerfile: docker/airflow.Dockerfile}
    restart: unless-stopped
    mem_limit: 6g
    command: standalone
    depends_on:
      s3-init: {condition: service_completed_successfully}
    environment:
      <<: *env
      SPARK_DRIVER_MEMORY: 3g
    volumes:
      - airflow-home:/opt/airflow
      - appdata:/data
    ports: ["127.0.0.1:8080:8080"]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped
    mem_limit: 128m
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    mem_limit: 512m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]

volumes:
  kafka-data:
  s3-data:
  airflow-home:
  appdata:
  prometheus-data:
  grafana-data:
