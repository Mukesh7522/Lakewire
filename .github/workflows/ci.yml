name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  lite-pipeline:
    # The free pipeline end to end with only its own requirements installed: a fake Wikimedia stream, real git
    # (two local repositories stand in for GitHub), real dbt and DuckDB, and the published site checked.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lite.txt
      - run: pip install -r requirements-lite.txt pytest==8.3.4
      - run: pytest -q tests/test_lite_store.py tests/test_lite_collect.py tests/test_lite_git.py tests/test_lite_pageviews.py tests/test_lite_run.py tests/test_export.py

  dbt-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-duckdb==1.11.1 duckdb==2.0.0
      - name: dbt build on parquet fixtures (models, incremental path and tests)
        working-directory: dbt
        env:
          DBT_FIXTURES_DIR: ../tests/fixtures
          DUCKDB_PATH: ci.duckdb
        run: |
          dbt build --target ci --profiles-dir .
          dbt build --target ci --profiles-dir .   # second run exercises the incremental branch

  end-to-end:
    # Real Kafka + SeaweedFS (S3) + Spark + Delta + DuckDB, in the same containers production uses.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml
      # Throwaway credentials for the ephemeral CI stack only (compose requires them to be set).
      S3_ACCESS_KEY: lakewire
      S3_SECRET_KEY: ci-only-not-a-secret
      GRAFANA_ADMIN_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-duckdb==1.11.1 duckdb==2.0.0
      - name: Validate compose file
        run: $COMPOSE config -q
      - name: Start Kafka and the S3 store
        run: |
          $COMPOSE up -d --wait kafka s3
          $COMPOSE run --rm kafka-init
          $COMPOSE run --rm s3-init
      - name: Build images
        run: $COMPOSE build producer spark-stream
      - name: Replay fixture events through the producer (run 1)
        run: $COMPOSE run --rm --no-deps producer python -m lakewire.producer --replay /app/tests/fixtures/sample_events.jsonl
      - name: Stream Kafka to Bronze and Silver (run 1)
        run: $COMPOSE run --rm --no-deps spark-stream python -m lakewire.streaming.edits_stream --once
      - name: Assert counts (run 1)
        run: $COMPOSE run --rm --no-deps spark-stream python scripts/smoke_check.py tests/fixtures/expected.json 1
      - name: Replay the same events again and re-stream (idempotency proof)
        run: |
          $COMPOSE run --rm --no-deps producer python -m lakewire.producer --replay /app/tests/fixtures/sample_events.jsonl
          $COMPOSE run --rm --no-deps spark-stream python -m lakewire.streaming.edits_stream --once
      - name: Assert Silver unchanged, Bronze and DLQ doubled (run 2)
        run: $COMPOSE run --rm --no-deps spark-stream python scripts/smoke_check.py tests/fixtures/expected.json 2
      - name: dbt build before any pageviews exist (fresh-deploy path)
        working-directory: dbt
        env:
          S3_HOSTPORT: localhost:9000
          LAKE_BUCKET: lake
          DUCKDB_PATH: /tmp/fresh.duckdb
        run: dbt build --target prod --profiles-dir .
      - name: Seed pageviews Delta table
        run: $COMPOSE run --rm --no-deps spark-stream python scripts/seed_pageviews.py /app/tests/fixtures/pageviews.parquet
      - name: dbt build against Delta on the S3 store (production target)
        working-directory: dbt
        env:
          S3_HOSTPORT: localhost:9000
          LAKE_BUCKET: lake
          DUCKDB_PATH: /tmp/smoke.duckdb
        run: dbt build --target prod --profiles-dir .
      - name: Export dashboard snapshot and check it
        env:
          DUCKDB_PATH: /tmp/smoke.duckdb
          EXPORT_DIR: /tmp/exports
        run: |
          PYTHONPATH=. python -m lakewire.export
          python - <<'PY'
          import json
          payload = json.load(open("/tmp/exports/health.json"))
          h = payload["rows"][0]
          assert h["events_total"] == 12, h
          assert payload["mode"] == "full", payload
          print("health ok:", h)
          PY
      - name: Show logs on failure
        if: failure()
        run: $COMPOSE logs --tail=200
      - name: Tear down
        if: always()
        run: $COMPOSE down -v
