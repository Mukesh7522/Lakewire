name: publish-dashboard

# Pulls the latest mart snapshot from the VM and publishes it to GitHub Pages.
# Fails (and GitHub emails you) when the pipeline has stopped producing fresh data.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Pull snapshot from the VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          mkdir -p site/data
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" \
            "cd /opt/lakewire && docker compose exec -T airflow tar -C /data/exports -cf - ." \
            | tar -C site/data -xf -
          ls -l site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Fail loudly if data is stale
        run: python3 scripts/check_freshness.py site/data/health.json --max-lag-minutes 45
